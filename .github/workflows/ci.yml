name: preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preflight:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      SQLITE_DB_LOCATION: ${{ runner.temp }}/todos.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
