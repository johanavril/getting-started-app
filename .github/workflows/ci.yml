name: preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preflight:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
        env:
          SQLITE_DB_LOCATION: ${{ runner.temp }}/todos.db
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          load: true
          tags: getting-started-app:${{ github.sha }}
      - run: docker run -d -p 3000:3000 --name getting-started-app getting-started-app:${{ github.sha }}
      - run: |
          curl --fail \
              --connect-timeout 5 \
              --max-time 10 \
              --retry 3 \
              --retry-delay 2 \
              --retry-max-time 30 \
              --retry-all-errors \
              http://localhost:3000/healthz || exit 1
      - run: docker logs getting-started-app
        if: always()
      - run: docker rm -f getting-started-app
        if: always()
